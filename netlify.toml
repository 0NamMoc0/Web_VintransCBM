# Netlify Configuration - Security Optimized

[build]
  publish = "."
  command = "echo 'No build needed - static site'"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Ngăn chặn Clickjacking
    X-Frame-Options = "DENY"
    
    # Ngăn chặn MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    
    # XSS Protection (legacy nhưng vẫn tốt)
    X-XSS-Protection = "1; mode=block"
    
    # Content Security Policy - Chống XSS
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data:;
      connect-src 'self';
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    """
    
    # Force HTTPS
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    
    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions Policy - Tắt các feature không cần
    Permissions-Policy = """
      geolocation=(),
      microphone=(),
      camera=(),
      payment=(),
      usb=(),
      magnetometer=(),
      gyroscope=(),
      accelerometer=()
    """

# Cache cho static assets
[[headers]]
  for = "/style*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/script*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Chặn truy cập các file nhạy cảm
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
